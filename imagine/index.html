<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Imagine AI Studio</title><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script type="text/javascript" src="config.js"></script><script type="text/javascript" src="script.js"></script></head><body><header><span class="logo-title">Imagine</span><span class="logo-sub">AI Studio</span><button class="btn-library" onclick="openLibrary()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Library<span class="lib-count" id="lib-count">0</span></button></header><div class="lib-backdrop" id="lib-backdrop" onclick="onBackdropClick(event)"><div class="lib-modal" id="lib-modal"><div class="lib-header"><span class="lib-title">Private Library</span><button class="lib-close" onclick="closeLibrary()">✕</button></div><div class="lib-toolbar"><span class="lib-info" id="lib-toolbar-info">0 saved images</span><button class="btn-clear-all" onclick="clearLibrary()">Clear all</button></div><div class="lib-scroll-area"><div class="lib-grid" id="lib-grid"></div></div></div></div><main><aside class="panel-left"><div class="tab-row"><button class="tab-btn" id="tab-btn-standard" onclick="setTab(TAB_STANDARD)">Standard</button><button class="tab-btn" id="tab-btn-advanced" onclick="setTab(TAB_ADVANCED)">Advanced</button></div><div class="tab-panel" id="tab-panel-standard"><div><div class="field-label">Prompt</div><textarea id="input-prompt" placeholder="Describe your image..."></textarea></div><div><div class="controls-grid"><div class="select-wrap"><div class="field-label">Aspect Ratio</div><select id="input-aspect" onchange="onImageSizeChange()"><option value="768x768">Square</option><option value="576x768">Portrait</option><option value="768x576">Landscape</option></select></div><div class="select-wrap"><div class="field-label">Quality</div><select id="input-quality"><option value="0">Fast</option><option value="1" selected>Balanced</option><option value="2">Quality</option></select></div></div></div><div><div class="field-label">Seed</div><div class="seed-row"><div class="seed-toggle"><button class="seed-toggle-btn" id="seed-btn-random" onclick="setSeedMode(SEED_RANDOM)">Random</button><button class="seed-toggle-btn" id="seed-btn-manual" onclick="setSeedMode(SEED_MANUAL)">Manual</button></div><div class="seed-input-wrap"><input type="number" id="seed-value" value="42" min="0" max="4294967295"><button class="btn-dice" id="btn-dice" onclick="randomizeSeed()" title="Generate random seed"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></button></div></div></div></div><div class="tab-panel" id="tab-panel-advanced"><div><div class="field-label">Generative Model</div><select id="input-model" disabled></select></div><div><div class="field-label">Guidance Scale</div><div class="guidance-row"><input type="range" class="guidance-slider" id="guidance-scale" min="0" max="1" step="0.25" value="0.5" oninput="updateGuidanceDisplay(this.value)"><div class="guidance-scale-labels"><span>Creative</span><span>Precise</span></div></div></div><div><div class="field-label">Negative Prompt</div><textarea id="input-negative" placeholder="Describe what you don't want in your image..."></textarea></div></div><button class="btn-generate" id="generate-btn" disabled onclick="startGeneration()">Generate Image</button><div class="status-row"><span class="status-dot busy" id="status-dot"></span><span id="status-text">Connecting...</span></div></aside><section class="panel-right"><div class="canvas-frame" id="canvas-frame"><div class="grid-bg"></div><div class="empty-state" id="empty-state"><svg class="empty-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="12" width="56" height="40" rx="4" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="26" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M4 40l14-10 10 8 10-12 14 14" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span class="empty-text">Your image will appear here</span></div><div class="loading-overlay" id="loading-overlay"><div class="canvas-progress"><div class="canvas-progress-bar" id="progress-bar"></div></div><span class="canvas-progress-label" id="progress-label">0%</span></div><img id="output-image" src=""><div class="action-buttons"><button class="action-button" id="btn-save" onclick="saveToLibrary()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Save</button></div></div></section></main></body></html>
